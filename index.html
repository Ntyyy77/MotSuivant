<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jeu de mots</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #502b2b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      color: white;
    }

    .header {
      position: absolute;
      top: 10px;
      left: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .score {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 18px;
      background: #f3f1f1;
      padding: 10px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropbtn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border: none;
      background-color: #ffffff;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #ffffff;
      min-width: 160px;
      box-shadow: 0px 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 6px;
      margin-top: 5px;
    }

    .dropdown-content div {
      padding: 12px 16px;
      cursor: pointer;
    }

    .dropdown-content div:hover {
      background-color: #eee;
    }

    #word-section {
      text-align: center;
      margin-top: 100px;
    }

    #word-intro {
      color: white;
      font-size: 18px;
    }

    #word-display {
      font-size: 24px;
      color: white;
    }

    .input-section {
      text-align: center;
      margin-top: 30px;
    }

    .input-section input {
      padding: 10px;
      font-size: 18px;
      width: 200px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .input-section button {
      padding: 10px 15px;
      font-size: 16px;
      margin-left: 10px;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    #restart-btn {
      background-color: #f44336;
    }

    .rules {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #555;
      background-color: #f1f1f1;
    }
  </style>
</head>
<body>

  <h1>Jeu de mots</h1>

  <div class="header">
    <div class="dropdown">
      <button id="lang-btn" class="dropbtn">Langue</button>
      <div class="dropdown-content">
        <div data-lang="fr">Français 🇫🇷</div>
        <div data-lang="en">Anglais 🇬🇧</div>
        <div data-lang="es">Espagnol 🇪🇸</div>
      </div>
    </div>
  </div>

  <div class="score" id="score-display">Score : 0</div>

  <div id="word-section">
    <p id="word-intro">Votre nouveau mot est :</p>
    <div id="word-display">Mot ici</div>
  </div>

  <div class="input-section">
    <input type="text" id="word-input" placeholder="Votre mot..." />
    <button id="check-btn">Vérifier</button>
    <button id="restart-btn">🔄 Restart</button>
  </div>

  <div class="rules" id="rules-text">
    Trouvez un mot qui commence par la fin du mot précédent.  
    Par exemple : <i>Chien → Entier → Erreur...</i>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const langBtn = document.getElementById('lang-btn');
    const options = document.querySelectorAll('.dropdown-content div');
    const rulesDiv = document.getElementById('rules-text');
    const scoreDisplay = document.getElementById('score-display');
    const wordDisplay = document.getElementById('word-display');
    const inputField = document.getElementById('word-input');
    const introText = document.getElementById('word-intro');

    let score = 0;
    let current_mot = "";

    const labels = {
      fr: "Français 🇫🇷",
      en: "Anglais 🇬🇧",
      es: "Espagnol 🇪🇸"
    };

    const rulesText = {
      fr: "Trouvez un mot qui commence par la fin du mot précédent. Exemple : Chien → Entier → Erreur...\nVous gagnez 1 point pour chaque lettre de la fin du mot précédent.",
      en: "Find a word that starts with the end of the previous word. Example: Dog → Geography → Hype...\nYou earn 1 point for each letter of the suffix of the previous word.",
      es: "Encuentra una palabra que comience con el final de la palabra anterior. Ejemplo: Perro → Romper → Permitido...\nGanas 1 punto por cada letra del final de la palabra anterior."
    };

    const introByLang = {
      fr: "Votre nouveau mot est :",
      en: "Your new word is:",
      es: "Tu nueva palabra es:"
    };

    function updateUI(lang) {
      langBtn.textContent = labels[lang] || lang;
      rulesDiv.textContent = rulesText[lang] || "Règles non disponibles.";
      introText.textContent = introByLang[lang] || "Votre nouveau mot est :";
    }

    ipcRenderer.on('language-updated', (event, lang) => {
      updateUI(lang);
    });

    ipcRenderer.on('new-word', (event, word) => {
      current_mot = word;
      wordDisplay.textContent = word;
    });

    options.forEach(opt => {
      opt.addEventListener('click', () => {
        const lang = opt.dataset.lang;
        ipcRenderer.send('set-language', lang);
        score = 0;
        scoreDisplay.textContent = "Score : 0";
      });
    });

    langBtn.addEventListener('click', () => {
      const dropdownContent = document.querySelector('.dropdown-content');
      dropdownContent.style.display = dropdownContent.style.display === 'block' ? 'none' : 'block';
    });

    window.addEventListener('click', (event) => {
      if (!event.target.closest('.dropdown')) {
        document.querySelector('.dropdown-content').style.display = 'none';
      }
    });

    document.getElementById('check-btn').addEventListener('click', () => {
      const newWord = inputField.value.trim();
      if (!newWord) return;

      current_mot = newWord;
      wordDisplay.textContent = current_mot;
      
      inputField.value = "";
      inputField.disabled = false;
      inputField.focus();
    });

    document.getElementById('restart-btn').addEventListener('click', () => {
      score = 0;
      scoreDisplay.textContent = "Score : 0";
      inputField.value = "";
      inputField.disabled = false;
      inputField.focus();

      const lang = langBtn.textContent.includes('Français') ? 'fr' :
                   langBtn.textContent.includes('Anglais') ? 'en' : 'es';
      ipcRenderer.send('set-language', lang);
    });
  </script>

</body>
</html>
